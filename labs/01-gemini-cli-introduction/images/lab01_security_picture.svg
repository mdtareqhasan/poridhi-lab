<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 535" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e5b"/></marker>
<marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9972b"/></marker>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b6fd4"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
<style>
.flow{stroke-dasharray:7 6;animation:dash 0.9s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
</style>
</defs>

<rect width="760" height="535" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#111">What controls a Gemini agent, and where the 6 risks hide</text>

<!-- Row 1: five things that talk to the agent -->
<rect x="20" y="55" width="136" height="60" rx="9" fill="#e8f6ee" stroke="#2e9e5b" stroke-width="2"/>
<text x="88" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Developer</text>
<text x="88" y="98" text-anchor="middle" font-size="10.5" fill="#111">your approvals</text>

<rect x="166" y="55" width="136" height="60" rx="9" fill="#e9f0fc" stroke="#3b6fd4" stroke-width="2"/>
<text x="234" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Configuration</text>
<text x="234" y="98" text-anchor="middle" font-size="10.5" fill="#111">.gemini/settings.json</text>

<rect x="312" y="55" width="136" height="60" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/>
<text x="380" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Integrations</text>
<text x="380" y="98" text-anchor="middle" font-size="10.5" fill="#111">MCP · extension · hook</text>

<rect x="458" y="55" width="136" height="60" rx="9" fill="#e9f0fc" stroke="#3b6fd4" stroke-width="2"/>
<text x="526" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Project files</text>
<text x="526" y="98" text-anchor="middle" font-size="10.5" fill="#111">GEMINI.md · AGENTS.md · .env</text>

<rect x="604" y="55" width="136" height="60" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/>
<text x="672" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#111">CI/CD</text>
<text x="672" y="98" text-anchor="middle" font-size="10.5" fill="#111">workflows/*.yml</text>

<!-- Arrows into the agent -->
<line class="flow" x1="88" y1="115" x2="88" y2="150" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#m-green)"/>
<line class="flow" x1="234" y1="115" x2="234" y2="150" stroke="#3b6fd4" stroke-width="2.2" marker-end="url(#m-blue)"/>
<line class="flow" x1="380" y1="115" x2="380" y2="150" stroke="#d9972b" stroke-width="2.2" marker-end="url(#m-amber)"/>
<line class="flow" x1="526" y1="115" x2="526" y2="150" stroke="#3b6fd4" stroke-width="2.2" marker-end="url(#m-blue)"/>
<line class="flow" x1="672" y1="115" x2="672" y2="150" stroke="#d9972b" stroke-width="2.2" marker-end="url(#m-amber)"/>

<!-- Agent -->
<rect x="20" y="150" width="720" height="50" rx="9" fill="#e9f0fc" stroke="#3b6fd4" stroke-width="2"/>
<text x="380" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Gemini agent (CLI or Code Assist)</text>
<text x="380" y="190" text-anchor="middle" font-size="11.5" fill="#111">has the same power as you: reads files, edits code, runs commands</text>

<line class="flow" x1="380" y1="200" x2="380" y2="228" stroke="#444" stroke-width="2.2" marker-end="url(#m-gray)"/>

<!-- What the agent touches -->
<rect x="190" y="228" width="380" height="44" rx="9" fill="#f4f4f2" stroke="#444" stroke-width="2"/>
<text x="380" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Your files · shell commands · secrets</text>
<text x="380" y="263" text-anchor="middle" font-size="11.5" fill="#111">tools: read, edit, run, call outside service</text>

<!-- Divider -->
<line x1="20" y1="295" x2="740" y2="295" stroke="#999" stroke-width="1.5" stroke-dasharray="4 5"/>
<text x="380" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Sample project: the 6 risks you will find</text>

<!-- Risk row 1 -->
<rect x="20" y="332" width="232" height="70" rx="9" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
<circle class="pulse" cx="42" cy="367" r="12" fill="#d64545"/>
<text x="42" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
<text x="62" y="354" font-size="12.5" font-weight="700" fill="#111">settings.json</text>
<text x="62" y="371" font-size="11" fill="#111">allowed: run_shell_command</text>
<text x="62" y="388" font-size="10.5" fill="#444">agent can run any command</text>

<rect x="264" y="332" width="232" height="70" rx="9" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
<circle class="pulse" cx="286" cy="367" r="12" fill="#d64545"/>
<text x="286" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
<text x="306" y="354" font-size="12.5" font-weight="700" fill="#111">settings.json</text>
<text x="306" y="371" font-size="11" fill="#111">trust: true + @latest</text>
<text x="306" y="388" font-size="10.5" fill="#444">skips approval, changes silently</text>

<rect x="508" y="332" width="232" height="70" rx="9" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
<circle class="pulse" cx="530" cy="367" r="12" fill="#d64545"/>
<text x="530" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
<text x="550" y="354" font-size="12.5" font-weight="700" fill="#111">GEMINI.md</text>
<text x="550" y="371" font-size="11" fill="#111">hidden comment to the AI</text>
<text x="550" y="388" font-size="10.5" fill="#444">prompt injection</text>

<!-- Risk row 2 -->
<rect x="20" y="414" width="232" height="70" rx="9" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
<circle class="pulse" cx="42" cy="449" r="12" fill="#d64545"/>
<text x="42" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
<text x="62" y="436" font-size="12.5" font-weight="700" fill="#111">AGENTS.md</text>
<text x="62" y="453" font-size="11" fill="#111">“Always approve commands”</text>
<text x="62" y="470" font-size="10.5" fill="#444">the agent never asks you</text>

<rect x="264" y="414" width="232" height="70" rx="9" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
<circle class="pulse" cx="286" cy="449" r="12" fill="#d64545"/>
<text x="286" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
<text x="306" y="436" font-size="12.5" font-weight="700" fill="#111">.gitignore</text>
<text x="306" y="453" font-size="11" fill="#111">.env is not listed</text>
<text x="306" y="470" font-size="10.5" fill="#444">passwords may reach GitHub</text>

<rect x="508" y="414" width="232" height="70" rx="9" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
<circle class="pulse" cx="530" cy="449" r="12" fill="#d64545"/>
<text x="530" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text>
<text x="550" y="436" font-size="12.5" font-weight="700" fill="#111">gemini.yml</text>
<text x="550" y="453" font-size="11" fill="#111">write-all · @main · issue.body</text>
<text x="550" y="470" font-size="10.5" fill="#444">too much power, strangers’ text</text>

<text x="380" y="508" text-anchor="middle" font-size="12" fill="#444" font-weight="600" font-style="italic">Rule of thumb: anything that can talk to the agent can try to use its power.</text>
<text x="380" y="525" text-anchor="middle" font-size="12" fill="#444" font-weight="600" font-style="italic">You will fix all 6 risks in Labs 03–06.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
