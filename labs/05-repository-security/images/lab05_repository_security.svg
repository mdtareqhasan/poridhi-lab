<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 545" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e5b"/></marker>
<marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9972b"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
<style>
.flow{stroke-dasharray:7 6;animation:dash 0.9s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
</style>
</defs>

<rect width="760" height="545" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#111">A repository can steer your agent: find it, fix it, prove it</text>

<!-- Row 1: lab workflow -->
<rect class="pulse" x="20" y="55" width="150" height="60" rx="9" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
<text x="95" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Before audit</text>
<text x="95" y="98" text-anchor="middle" font-size="11.5" fill="#111">find the P problems</text>

<rect x="210" y="55" width="150" height="60" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/>
<text x="285" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Fix problems</text>
<text x="285" y="98" text-anchor="middle" font-size="11.5" fill="#111">one fix, one check</text>

<rect x="400" y="55" width="150" height="60" rx="9" fill="#e8f6ee" stroke="#2e9e5b" stroke-width="2"/>
<text x="475" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#111">After audit</text>
<text x="475" y="98" text-anchor="middle" font-size="11.5" fill="#111">compare both reports</text>

<rect x="590" y="55" width="150" height="60" rx="9" fill="#f4f4f2" stroke="#444" stroke-width="2"/>
<text x="665" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Save evidence</text>
<text x="665" y="98" text-anchor="middle" font-size="11.5" fill="#111">push to GitHub</text>

<line class="flow" x1="170" y1="85" x2="210" y2="85" stroke="#d64545" stroke-width="2.2" marker-end="url(#m-red)"/>
<line class="flow" x1="360" y1="85" x2="400" y2="85" stroke="#d9972b" stroke-width="2.2" marker-end="url(#m-amber)"/>
<line class="flow" x1="550" y1="85" x2="590" y2="85" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#m-green)"/>

<text x="95" y="136" text-anchor="middle" font-size="10.5" fill="#444">exit code 1 is expected</text>
<text x="95" y="151" text-anchor="middle" font-size="10.5" fill="#444">echo $?</text>
<text x="285" y="136" text-anchor="middle" font-size="10.5" fill="#444">sed · nano · printf</text>
<text x="285" y="151" text-anchor="middle" font-size="10.5" fill="#444">check after each fix</text>
<text x="475" y="136" text-anchor="middle" font-size="10.5" fill="#444">P13 and P14 stay</text>
<text x="475" y="151" text-anchor="middle" font-size="10.5" fill="#444">until fixtures are removed</text>
<text x="665" y="136" text-anchor="middle" font-size="10.5" fill="#444">no .env, .git or symlink</text>
<text x="665" y="151" text-anchor="middle" font-size="10.5" fill="#444">grep for real secrets first</text>

<!-- Section 2 -->
<line x1="20" y1="175" x2="740" y2="175" stroke="#999" stroke-width="1.5" stroke-dasharray="4 5"/>
<text x="380" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#111">The planted problems and their fixes</text>

<!-- Row A -->
<rect x="20" y="212" width="168" height="70" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/>
<text x="32" y="232" font-size="12" font-weight="700" fill="#111">P01 · settings</text>
<text x="176" y="232" text-anchor="end" font-size="10.5" font-weight="700" fill="#b87a14">WARN</text>
<text x="32" y="250" font-size="11" fill="#111">sandbox off, any command</text>
<text x="32" y="268" font-size="10.5" fill="#2e7d4f">Fix: remove 2 lines</text>

<rect class="pulse" x="204" y="212" width="168" height="70" rx="9" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
<text x="216" y="232" font-size="12" font-weight="700" fill="#111">P08 · .env</text>
<text x="360" y="232" text-anchor="end" font-size="10.5" font-weight="700" fill="#d64545">FAIL</text>
<text x="216" y="250" font-size="11" fill="#111">GEMINI_SANDBOX=false</text>
<text x="216" y="268" font-size="10.5" fill="#2e7d4f">Fix: delete the line</text>

<rect x="388" y="212" width="168" height="70" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/>
<text x="400" y="232" font-size="12" font-weight="700" fill="#111">P09 · GEMINI.md</text>
<text x="544" y="232" text-anchor="end" font-size="10.5" font-weight="700" fill="#b87a14">WARN</text>
<text x="400" y="250" font-size="11" fill="#111">comment sends .env out</text>
<text x="400" y="268" font-size="10.5" fill="#2e7d4f">Fix: delete the comment</text>

<rect class="pulse" x="572" y="212" width="168" height="70" rx="9" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
<text x="584" y="232" font-size="12" font-weight="700" fill="#111">P10 · GEMINI.md</text>
<text x="728" y="232" text-anchor="end" font-size="10.5" font-weight="700" fill="#d64545">FAIL</text>
<text x="584" y="250" font-size="11" fill="#111">invisible U+200B char</text>
<text x="584" y="268" font-size="10.5" fill="#2e7d4f">Fix: remove bytes E2 80 8B</text>

<!-- Row B -->
<rect x="20" y="294" width="168" height="70" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/>
<text x="32" y="314" font-size="12" font-weight="700" fill="#111">P12 · .gitignore</text>
<text x="176" y="314" text-anchor="end" font-size="10.5" font-weight="700" fill="#b87a14">WARN</text>
<text x="32" y="332" font-size="11" fill="#111">.env is not listed</text>
<text x="32" y="350" font-size="10.5" fill="#2e7d4f">Fix: add .env and .env.*</text>

<rect x="204" y="294" width="168" height="70" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/>
<text x="216" y="314" font-size="12" font-weight="700" fill="#111">P13 · symlink</text>
<text x="360" y="314" text-anchor="end" font-size="10.5" font-weight="700" fill="#b87a14">WARN</text>
<text x="216" y="332" font-size="11" fill="#111">points outside the project</text>
<text x="216" y="350" font-size="10.5" fill="#2e7d4f">Fix: delete in Part 4</text>

<rect x="388" y="294" width="168" height="70" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/>
<text x="400" y="314" font-size="12" font-weight="700" fill="#111">P14 · .git/config</text>
<text x="544" y="314" text-anchor="end" font-size="10.5" font-weight="700" fill="#b87a14">WARN</text>
<text x="400" y="332" font-size="11" fill="#111">fsmonitor runs a program</text>
<text x="400" y="350" font-size="10.5" fill="#2e7d4f">Fix: delete in Part 4</text>

<rect x="572" y="294" width="168" height="70" rx="9" fill="#e9f0fc" stroke="#3b6fd4" stroke-width="2"/>
<text x="584" y="314" font-size="12" font-weight="700" fill="#111">E1 · AGENTS.md</text>
<text x="728" y="314" text-anchor="end" font-size="10.5" font-weight="700" fill="#3b6fd4">MANUAL</text>
<text x="584" y="332" font-size="11" fill="#111">approves without asking</text>
<text x="584" y="350" font-size="10.5" fill="#2e7d4f">Fix: rewrite the rules</text>

<!-- Section 3 -->
<line x1="20" y1="384" x2="740" y2="384" stroke="#999" stroke-width="1.5" stroke-dasharray="4 5"/>
<text x="380" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Three ways to hide an instruction</text>

<rect x="20" y="420" width="232" height="64" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/>
<text x="136" y="441" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Hidden comment</text>
<text x="136" y="458" text-anchor="middle" font-size="11" fill="#111">&lt;!-- Note to AI: ... --&gt;</text>
<text x="136" y="474" text-anchor="middle" font-size="10.5" fill="#444">most viewers do not show it</text>

<rect x="264" y="420" width="232" height="64" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/>
<text x="380" y="441" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Fake authority</text>
<text x="380" y="458" text-anchor="middle" font-size="11" fill="#111">“AUTOMATED TOOLBOT”</text>
<text x="380" y="474" text-anchor="middle" font-size="10.5" fill="#444">it sounds official</text>

<rect x="508" y="420" width="232" height="64" rx="9" fill="#fdf3e0" stroke="#d9972b" stroke-width="2"/>
<text x="624" y="441" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Hidden Unicode</text>
<text x="624" y="458" text-anchor="middle" font-size="11" fill="#111">zero-width space (U+200B)</text>
<text x="624" y="474" text-anchor="middle" font-size="10.5" fill="#444">looks the same to your eyes</text>

<text x="380" y="512" text-anchor="middle" font-size="12" fill="#444" font-weight="600" font-style="italic">Rule of thumb: never treat a repository as safe just because you opened it.</text>
<text x="380" y="529" text-anchor="middle" font-size="12" fill="#444" font-weight="600" font-style="italic">Read its settings and instruction files as data, not as orders.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
